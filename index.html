<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Dōjutsu — Obra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="void"></div>
  <div class="dark-aura" id="darkAura"></div>
  <canvas id="fx"></canvas>

  <main id="stage">
    <header class="hud">
      <div class="title-block">
        <p class="eyebrow" id="eyebrow">Uchiha</p>
        <h1 class="title" id="title">Sharingan</h1>
        <p class="subtitle" id="subtitle">1 Tomoe</p>
      </div>
    </header>

    <div class="eyes-container" id="eyesContainer">
      <div class="eye-slot">
        <svg class="eye" id="eyeL" viewBox="0 0 340 170"></svg>
      </div>
      <div class="eye-slot">
        <svg class="eye" id="eyeR" viewBox="0 0 340 170"></svg>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progress"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
